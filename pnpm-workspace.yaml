# Reiner Root-Workspace (keine Sub-Pakete). Das `packages`-Feld ist bei
# älteren pnpm-Versionen (Cloudflare Workers Builds nutzt teils noch pnpm 9)
# Pflicht, sonst bricht `pnpm install` mit "packages field missing or empty" ab.
packages:
  - "."

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@hexclave/next@1.0.64'
  - '@hexclave/sc@1.0.64'
  - '@hexclave/shared@1.0.64'
  - '@hexclave/ui@1.0.64'
  - postcss@8.5.23
